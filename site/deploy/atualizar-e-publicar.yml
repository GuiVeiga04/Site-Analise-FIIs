# MOVER ESTE ARQUIVO PARA .github/workflows/ na raiz do repositório.
# Coleta diária das cotações (dias úteis) + publicação do site no GitHub Pages.
#
# Pré-requisito (uma vez): Settings -> Pages -> Source = "GitHub Actions"
#                          Settings -> Actions -> General -> Workflow permissions = "Read and write"
name: Atualizar dados e publicar site

on:
  schedule:
    # Seg-sex, 21:30 UTC = 18:30 em Brasília, depois do fechamento da B3
    # (coletar durante o pregão grava volume parcial do dia). O GitHub Actions
    # usa UTC sempre — o Brasil não tem horário de verão, então não muda ao
    # longo do ano. Sábado e domingo não têm pregão, por isso ficam de fora
    # (rodar nesses dias só repetiria a cotação de sexta).
    - cron: "30 21 * * 1-5"
  push:
    branches: [main]
    paths: ["site/**", "fiis_config.json", "gerar_dados_site.py", "fiis_common.py", "base_*.csv", "criterios_checklist.json"]
  workflow_dispatch:
    inputs:
      coletar:
        description: "Rodar a coleta do Yahoo Finance antes de publicar?"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: site/backend/requirements.txt
      - run: pip install -r site/backend/requirements.txt

      - name: Coletar cotações e rendimentos
        if: github.event_name == 'schedule' || inputs.coletar == true
        run: |
          python atualizador_fiis.py
          # Se o Yahoo falhar nos rendimentos, publica mesmo assim com o CSV anterior
          python coletar_dividendos.py || echo "::warning::Coleta de rendimentos falhou; mantendo base anterior"
          # CVM, Banco Central e Fundamentus; cada fonte que falhar mantém o CSV anterior
          python coletar_fundamentos.py || echo "::warning::Alguma fonte de fundamentos falhou; veja o log"
          python gerar_dados_site.py

      # Diagnóstico de IA de cada fundo (Claude). Precisa do secret ANTHROPIC_API_KEY
      # (Settings -> Secrets and variables -> Actions). Sem o secret, o passo só avisa.
      # Só chama a API para fundos cujos dados mudaram desde a última geração.
      - name: Diagnósticos de IA
        if: github.event_name == 'schedule' || inputs.coletar == true
        working-directory: site/backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIIS_MODELO_IA: ${{ vars.FIIS_MODELO_IA }}
        run: python -m scripts.gerar_diagnosticos_ia || echo "::warning::Diagnósticos de IA falharam; mantendo os anteriores"

      - name: Salvar histórico atualizado no repositório
        if: github.event_name == 'schedule' || inputs.coletar == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add base_fiis_historico.csv data/
          git add base_fiis_dividendos.csv base_fiis_cvm.csv base_fiis_fundamentus.csv base_indicadores.csv 2>/dev/null || true
          git diff --cached --quiet || git commit -m "dados: coleta diária $(date +%F)"
          git push

      - name: Testes do backend
        working-directory: site/backend
        run: python -m pytest -q

      - name: Exportar JSON estático
        working-directory: site/backend
        run: python -m scripts.exportar_estatico ../frontend/public/data

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/frontend/package-lock.json

      - name: Build do front-end
        working-directory: site/frontend
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/deploy-pages@v4
